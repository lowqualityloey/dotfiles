# Enable mouse scrolling and pane/window selection
set -g mouse on

# 256-color & true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Start window and pane numbering at 1 (more ergonomic on keyboards)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# History buffer size
set -g history-limit 10000

# Intuitive pane splitting shortcuts (| and -) keeping current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Fast config reload with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

name: CI

on:
  # The default branch plus wip/** scratch branches. Other feature-branch pushes
  # that already have an open PR fire the pull_request run alone, not both.
  push:
    branches: [main, "wip/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Stable, descriptive check name: branch protection can require "CI / tests"
    # without it moving when the runner image or the steps below change.
    name: tests
    # ubuntu-latest is mid-migration to 26.04 (Oct 19 - Nov 19, 2026); pin the
    # image so the runner does not change underneath the suite.
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # test-zsh-startup.sh skips silently without zsh; install it so the
      # .zshrc parse runs in CI instead of being reported as "ok" while skipped.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # The interactive startup layer needs oh-my-zsh, the three custom plugins
      # .zshrc lists, and the repo's quiet fzf plugin: the stock fzf plugin
      # writes "can't change option: zle" to stderr in a non-TTY shell, which
      # the test treats as a failure.
      #
      # The clones are pinned by SHA in .github/zsh-plugins.lock, and the cache
      # key hashes that file, so an unchanged lock reuses the tree and only a
      # bump pays for the network. A shallow fetch of a specific SHA works, so
      # the install stays small.
      - name: Cache oh-my-zsh and zsh plugins
        uses: actions/cache@v6
        with:
          path: ~/.oh-my-zsh
          key: oh-my-zsh-${{ runner.os }}-${{ hashFiles('.github/zsh-plugins.lock') }}

      - name: Install oh-my-zsh and zsh plugins
        run: |
          # Only clone what the cache did not already provide at the pinned SHA,
          # so a hit does four rev-parse calls and no network, and a partial or
          # stale restore repairs just the affected repo.
          while read -r repo dest sha; do
            case "$repo" in ""|"#"*) continue ;; esac
            target="$HOME/$dest"
            if [ "$(git -C "$target" rev-parse HEAD 2>/dev/null)" = "$sha" ]; then
              continue
            fi
            mkdir -p "$(dirname "$target")"
            git init -q "$target"
            git -C "$target" remote remove origin 2>/dev/null || true
            git -C "$target" remote add origin "https://github.com/$repo.git"
            git -C "$target" fetch -q --depth=1 origin "$sha"
            git -C "$target" checkout -q --detach FETCH_HEAD
          done < .github/zsh-plugins.lock

          # Always repoint the symlink so a restored cache and a fresh install
          # both point at this checkout.
          custom="$HOME/.oh-my-zsh/custom"
          mkdir -p "$custom/plugins/fzf"
          ln -sf "$GITHUB_WORKSPACE/zsh/plugins/fzf/fzf.plugin.zsh" "$custom/plugins/fzf/fzf.plugin.zsh"

      # Installed from the pinned dev requirements so tests/test_secret_scan.py
      # runs through pytest rather than the plain-python3 fallback.
      - name: Install dev dependencies
        run: python -m pip install --quiet -r requirements-dev.txt

      # run.sh skips the lint step when shellcheck is missing, which would let
      # CI go green without linting. Fail loudly if it is not on the runner.
      - name: Ensure shellcheck is available
        run: shellcheck --version

      - name: Run tests and lint
        env:
          PYTHON: python
        run: sh tests/run.sh

name: CI

on:
  # The default branch plus wip/** scratch branches. Other feature-branch pushes
  # that already have an open PR fire the pull_request run alone, not both.
  push:
    branches: [main, "wip/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Stable, descriptive check name: branch protection can require "CI / tests"
    # without it moving when the runner image or the steps below change.
    name: tests
    # ubuntu-latest is mid-migration to 26.04 (Oct 19 - Nov 19, 2026); pin the
    # image so the runner does not change underneath the suite.
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # test-zsh-startup.sh skips silently without zsh; install it so the
      # .zshrc parse runs in CI instead of being reported as "ok" while skipped.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # The interactive startup layer needs oh-my-zsh, the three custom plugins
      # .zshrc lists, and the repo's quiet fzf plugin: the stock fzf plugin
      # writes "can't change option: zle" to stderr in a non-TTY shell, which
      # the test treats as a failure.
      - name: Install oh-my-zsh and zsh plugins
        run: |
          git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git "$HOME/.oh-my-zsh"
          custom="$HOME/.oh-my-zsh/custom"
          mkdir -p "$custom/plugins/fzf"
          git clone --depth=1 https://github.com/zsh-users/zsh-autosuggestions.git "$custom/plugins/zsh-autosuggestions"
          git clone --depth=1 https://github.com/zsh-users/zsh-syntax-highlighting.git "$custom/plugins/zsh-syntax-highlighting"
          git clone --depth=1 https://github.com/Aloxaf/fzf-tab.git "$custom/plugins/fzf-tab"
          ln -s "$GITHUB_WORKSPACE/zsh/plugins/fzf/fzf.plugin.zsh" "$custom/plugins/fzf/fzf.plugin.zsh"

      # Installed from the pinned dev requirements so tests/test_secret_scan.py
      # runs through pytest rather than the plain-python3 fallback.
      - name: Install dev dependencies
        run: python -m pip install --quiet -r requirements-dev.txt

      # run.sh skips the lint step when shellcheck is missing, which would let
      # CI go green without linting. Fail loudly if it is not on the runner.
      - name: Ensure shellcheck is available
        run: shellcheck --version

      - name: Run tests and lint
        env:
          PYTHON: python
        run: sh tests/run.sh
